<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlameScope Blueprint</title>
<meta name="description" content="How FlameScope works, from NASA's raw files to VESTA's answers. Generated from the real code.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231b2943'/%3E%3Crect x='1.5' y='1.5' width='61' height='61' rx='10.5' fill='none' stroke='%23435e88' stroke-width='3'/%3E%3Cpath fill='%238cb6ff' transform='translate(-7.4 -4.4) scale(3.28)' d='M12.4 4.4c.2 2-.8 3.3-1.9 4.5-1.2 1.3-2.5 2.6-2.5 4.9a4 4 0 0 0 8 0c0-1.6-.6-2.8-1.4-3.8-.1 1.1-.6 2-1.5 2.3.5-2.8-.2-5.9-.7-7.9Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>:root {
  --bg: #070b14; --panel: #0d1322; --raised: #131b2e; --line: #1f2a44; --text: #e8ecf6; --muted: #97a3bc;
  --ember: #ff7a2f; --ember-soft: #ffb98a; --acme: #4cc9f0; --cfi: #a78bfa; --spice: #5ee6a8;
  --ok: #5ee6a8; --warn: #ffc857; --bad: #ff5d6c;
  --head: "Chakra Petch", "Segoe UI", system-ui, sans-serif; --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.6 var(--body); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(900px 500px at 85% -5%, rgba(255, 122, 47, .13), transparent 65%), radial-gradient(800px 600px at -5% 40%, rgba(76, 201, 240, .07), transparent 65%), radial-gradient(800px 600px at 105% 85%, rgba(167, 139, 250, .07), transparent 65%); }
#stars { position: fixed; inset: 0; z-index: -2; width: 100%; height: 100%; }
h1, h2, h3, h4 { font-family: var(--head); line-height: 1.2; margin: 0; letter-spacing: .01em; }
p { margin: 0; }
ol, ul { margin: 0; padding: 0; list-style: none; }
a { color: var(--ember-soft); }
code { font: 500 .88em var(--mono); color: var(--ember-soft); overflow-wrap: anywhere; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 60; background: var(--ember); color: #070b14; padding: 6px 12px; border-radius: 6px; }
.skip:focus { left: 8px; }
.noscript { padding: 40px 16px; text-align: center; }

/* explanation level */
.mode-s .t-e, .mode-s .t-e-inline { display: none !important; }
.mode-e .t-s { display: none !important; }

/* top bar */
#bar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 16px; padding: 9px 20px; background: rgba(7, 11, 20, .88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; color: var(--text); text-decoration: none; font: 700 16px var(--head); letter-spacing: .05em; white-space: nowrap; }
.brand em { font-style: normal; color: var(--ember); font-weight: 500; }
@keyframes flick { 50% { transform: scale(.92, 1.06); } }
#nav { flex: 1; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
#nav::-webkit-scrollbar { display: none; }
#nav a { flex: none; padding: 5px 10px; border-radius: 6px; color: var(--muted); font-size: 13.5px; text-decoration: none; transition: color .2s, background .2s; }
#nav a:hover { color: var(--text); background: var(--raised); }
#nav a.on { color: var(--text); background: rgba(255, 122, 47, .16); }
.mode { display: flex; flex: none; padding: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.mode button { padding: 4px 10px; background: none; border: 0; border-radius: 6px; color: var(--muted); font-size: 13px; }
.mode button[aria-pressed="true"] { background: var(--ember); color: #1b0d03; font-weight: 600; }

main { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
.eyebrow { font: 500 12.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ember-soft); }
.lead { color: var(--muted); max-width: 74ch; margin-top: 10px; }
.lead.big { font-size: 18.5px; color: #c6cfe2; }
.note { color: var(--muted); font-size: 14px; margin-top: 10px; }
.muted { color: var(--muted); }

/* hero */
.hero { padding: 58px 0 26px; }
.fire { font-size: clamp(44px, 8.5vw, 88px); font-weight: 700; margin-top: 8px; background: linear-gradient(95deg, #ffd9b8, #ff7a2f 45%, #ff5d6c 75%, #ffb98a); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: burn 9s ease-in-out infinite alternate; }
@keyframes burn { to { background-position: 100% 0; } }
.stamp { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; font-size: 13.5px; color: var(--muted); }
.live-badge { display: none; align-items: center; gap: 6px; color: var(--ok); }
.live-badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 1.6s infinite; }
[data-live] .live-badge { display: inline-flex; }
@keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
.stats { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 26px; }
.stats li { padding: 12px 10px; background: rgba(13, 19, 34, .85); border: 1px solid var(--line); border-radius: 10px; text-align: center; }
.stats b { display: block; font: 500 clamp(22px, 2.6vw, 31px) var(--mono); line-height: 1.15; }
.stats span { font-size: 12.5px; color: var(--muted); line-height: 1.25; display: block; margin-top: 2px; }
.banner { margin-bottom: 22px; padding: 12px 14px; border: 1px solid var(--warn); border-radius: 10px; background: rgba(255, 200, 87, .1); font-size: 14.5px; }
.banner code { margin: 0 4px; }
.banner span { display: block; margin-top: 4px; color: var(--muted); }

.banner.review { border-color: var(--ember); background: rgba(255, 122, 47, .1); }
.review-list { display: grid; gap: 5px; margin-top: 8px; }
.review-list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 8px; font-size: 13.5px; }
.review-list span { display: inline; margin: 0; }
.review-pill { display: inline-block; margin-left: 10px; padding: 1px 8px; border: 1px solid var(--warn); border-radius: 999px; color: var(--warn); font-size: 11px; letter-spacing: .04em; text-transform: none; }
.watch-group { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 8px; }
.watch-group b { width: 100%; font: 600 14px var(--head); }

/* sections + panels */
.sec { padding: 54px 0 8px; }
.sec-head { margin-bottom: 20px; }
.sec-head h2 { font-size: clamp(27px, 4vw, 40px); margin-top: 6px; }
.panel { position: relative; background: rgba(13, 19, 34, .9); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 16px; }
.panel-head { margin-bottom: 14px; }
.panel-head h3 { font-size: 20px; }
.panel-head p { color: var(--muted); margin-top: 4px; font-size: 15px; max-width: 76ch; }
.detail { margin-top: 14px; padding: 14px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; min-height: 76px; }
.detail.tight { min-height: 66px; font-size: 15px; }
.detail h3 { font-size: 18px; margin-bottom: 5px; }
.detail > b:first-child { color: var(--ember-soft); margin-right: 3px; }
.files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.file { display: inline-block; font: 500 12.5px var(--mono); color: var(--ember-soft); text-decoration: none; padding: 2px 7px; background: rgba(255, 122, 47, .09); border: 1px solid rgba(255, 122, 47, .25); border-radius: 5px; overflow-wrap: anywhere; }
.file:hover { background: rgba(255, 122, 47, .2); }
.jump { display: inline-block; margin-top: 10px; font-size: 14.5px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.more { margin-top: 12px; font-size: 14.5px; }
.more summary { cursor: pointer; color: var(--ember-soft); padding: 3px 0; }
details.panel { padding: 12px 18px; }
.cite { margin-top: 10px; color: var(--muted); font-size: 13.5px; }
.btn { padding: 7px 14px; background: var(--ember); color: #1b0d03; border: 0; border-radius: 8px; font-weight: 600; font-size: 14.5px; }
.btn:hover { background: var(--ember-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip, .tab { padding: 6px 12px; background: var(--raised); border: 1px solid var(--line); border-radius: 999px; color: var(--text); font-size: 14px; transition: border-color .2s, background .2s; }
.chip:hover, .tab:hover { border-color: var(--ember); }
.chip.on, .tab.on { background: rgba(255, 122, 47, .18); border-color: var(--ember); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tabs .btn { margin-left: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 13px; font-size: 13.5px; color: var(--muted); }
.legend b { color: var(--text); font: 500 13.5px var(--mono); }
.dot { font-size: 11px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border: 1px solid var(--p); border-radius: 999px; color: var(--text); font-size: 13px; background: color-mix(in srgb, var(--p) 14%, transparent); white-space: nowrap; }
.pill i { font-style: normal; color: var(--p); font-weight: 700; }

/* machine map */
.map { position: relative; display: grid; gap: 34px 26px; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-areas: "nasa ingest clean brains api pages you" ". . . tools vesta engines ." ". . repo . . . vercel"; padding: 8px 2px; }
.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.node { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 76px; padding: 9px 8px; text-align: center; background: var(--raised); border: 1px solid #2b3a5c; border-radius: 12px; transition: transform .18s, border-color .2s, box-shadow .2s; }
.node b { font: 600 15px/1.15 var(--head); }
.node span { font-size: 12px; line-height: 1.2; color: var(--muted); }
.node:hover { transform: translateY(-2px); border-color: var(--ember); }
.node.on { border-color: var(--ember); box-shadow: 0 0 0 1px var(--ember), 0 0 24px rgba(255, 122, 47, .35); }
.node-vesta { background: linear-gradient(160deg, #2a1608, var(--raised)); border-color: rgba(255, 122, 47, .6); }
.node-nasa { border-color: rgba(76, 201, 240, .55); }

/* journey */
.invs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.inv { padding: 15px; background: rgba(13, 19, 34, .9); border: 1px solid var(--line); border-top: 3px solid var(--inv); border-radius: 12px; }
.inv h4 { font-size: 19px; }
.inv small { font: 400 14px var(--body); color: var(--muted); margin-left: 3px; }
.inv > p { font-size: 14.5px; color: #c6cfe2; margin-top: 6px; }
.inv-files { margin-top: 11px; display: grid; gap: 6px; }
.inv-files li { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
.inv-files span { font-size: 12.5px; color: var(--muted); padding-left: 2px; }
.steps { position: relative; display: flex; justify-content: space-between; gap: 4px; --done: 0%; }
.steps::before, .steps::after { content: ""; position: absolute; left: 22px; right: 22px; top: 18px; height: 2px; background: var(--line); }
.steps::after { right: auto; width: calc((100% - 44px) * var(--w, 1)); background: none; }
.steps li { flex: 1; min-width: 0; position: relative; z-index: 1; }
.step { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; padding: 0 2px; background: none; border: 0; color: var(--muted); font-size: 13.5px; line-height: 1.2; }
.step i { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--raised); border: 2px solid var(--line); font: 500 14px var(--mono); transition: all .25s; }
.step small { font-size: 11.5px; color: var(--muted); }
.step:hover { color: var(--text); }
.step.past i { border-color: var(--ember); color: var(--ember-soft); }
.step.on { color: var(--text); font-weight: 600; }
.step.on i { background: var(--ember); border-color: var(--ember); color: #1b0d03; box-shadow: 0 0 18px rgba(255, 122, 47, .6); }
.lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.lane { padding: 13px; background: var(--raised); border: 1px solid var(--line); border-radius: 11px; }
.lane header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lane-n { font: 500 25px var(--mono); }
.lane h4 { font-size: 16px; margin-top: 3px; }
.lane h4 small { display: block; font: 400 13px var(--body); color: var(--muted); margin-top: 1px; }
.bar { display: flex; gap: 2px; height: 12px; margin: 10px 0 7px; }
.seg { display: block; min-width: 3px; border-radius: 3px; }
.use { margin-top: 7px; font-size: 13.5px; color: var(--muted); }
.equation { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 12px; margin-top: 16px; padding: 12px; border: 1px dashed #2b3a5c; border-radius: 10px; }
.equation b { font: 500 22px var(--mono); margin-right: 3px; }
.equation i { font-style: normal; color: var(--muted); font-size: 21px; }
.eq-final { padding: 2px 10px; background: rgba(255, 122, 47, .16); border-radius: 7px; }
.clean { width: 100%; border-collapse: collapse; margin-top: 13px; font-size: 14px; }
.clean th { padding: 4px 8px; text-align: left; font: 500 12.5px var(--mono); color: var(--muted); border-bottom: 1px solid var(--line); }
.clean td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; transition: opacity .3s, background .6s; }
.clean .col { display: block; color: var(--muted); font-size: 13px; }
.clean .how { color: var(--ember-soft); font-size: 13.5px; }
.clean tr.pending td:nth-child(n+2) { opacity: .1; }
.clean tr.flash td { background: rgba(255, 122, 47, .07); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 3px 16px; margin-top: 8px; }
.kv li { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.kv span { color: var(--muted); }
.chunks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chunks article { padding: 12px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; font-size: 14px; overflow-wrap: anywhere; }
.chunks header { margin-bottom: 6px; }
mark { background: rgba(255, 122, 47, .28); color: var(--text); border-radius: 2px; padding: 0 1px; }

/* storage */
.flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.flow-card { position: relative; padding: 14px; background: rgba(13, 19, 34, .9); border: 1px solid var(--line); border-radius: 12px; }
.panel .flow-card { background: var(--raised); }
.flow-card i { font: 500 12.5px var(--mono); color: var(--ember-soft); font-style: normal; }
.flow-card h4 { font-size: 16.5px; margin-top: 2px; }
.flow-card p { font-size: 14.5px; color: var(--muted); margin-top: 4px; }
.env { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 18px; }
.slider { display: block; margin-top: 14px; font-size: 14.5px; }
.slider span { display: flex; justify-content: space-between; }
.slider output { font: 500 14.5px var(--mono); color: var(--ember-soft); }
input[type="range"] { width: 100%; accent-color: var(--ember); margin-top: 3px; }
.verdict { margin-top: 14px; padding: 12px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; }
.v-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px; margin-bottom: 4px; }
.v-n { font: 500 32px/1 var(--mono); }
.formula { display: flex; flex-direction: column; margin-top: 7px; font: 400 13px var(--mono); color: var(--muted); }
.formula b { color: var(--text); }
.chart-legend { margin-bottom: 4px; }
.swatch-box { display: inline-block; width: 12px; height: 10px; border: 1.5px solid var(--ember); background: rgba(255, 122, 47, .2); border-radius: 2px; vertical-align: -1px; }
.chart-wrap { position: relative; }
#env-svg { display: block; width: 100%; height: auto; }
#env-svg .grid { stroke: #18213a; stroke-width: 1; }
#env-svg .axis { fill: var(--muted); font: 12px var(--mono); }
#env-svg .axis-t { fill: var(--muted); font: 13px var(--body); }
#env-svg .pt { opacity: .78; }
#env-svg .win { fill: rgba(255, 122, 47, .18); stroke: var(--ember); stroke-width: 1.5; transition: all .16s; }
#env-svg .pin { fill: var(--ember); stroke: var(--bg); stroke-width: 2; transition: all .16s; }
.tip { position: absolute; z-index: 3; pointer-events: none; padding: 5px 9px; background: #000; border: 1px solid #2b3a5c; border-radius: 7px; font-size: 13px; white-space: nowrap; }
.ids li { display: flex; }

/* tracer */
.tracer { position: relative; display: grid; grid-template-columns: 1fr 1.25fr 1.25fr 1fr; gap: 44px; margin-top: 16px; }
.tcol { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 5px; align-items: stretch; }
.tcol h4 { font: 500 12.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.tn { padding: 3px 9px; font: 500 12.5px/1.45 var(--mono); background: var(--raised); border: 1px solid var(--line); border-radius: 7px; color: var(--muted); opacity: .4; overflow-wrap: anywhere; transition: opacity .25s, border-color .25s, color .25s, box-shadow .25s; }
.tn.lit { opacity: 1; color: var(--text); border-color: var(--ember); box-shadow: 0 0 10px rgba(255, 122, 47, .22); }
.tcol:last-child .tn.lit { border-color: var(--spice); box-shadow: 0 0 10px rgba(94, 230, 168, .22); }
.trace-key { margin-top: 12px; }
.k { display: inline-block; width: 22px; vertical-align: middle; margin-right: 3px; border-top: 2px solid var(--ember); }
.k.dashed { border-top: 2px dashed var(--muted); }
.try { margin-top: 7px; font-size: 14.5px; color: var(--ember-soft); }
.files-line { margin-top: 7px; font-size: 13.5px; color: var(--muted); }
.minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(225px, 1fr)); gap: 10px; }
.mini { padding: 12px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; }
.mini h4 { font-size: 15.5px; }
.mini p { font-size: 14px; color: var(--muted); margin: 4px 0 8px; }
.scroll { overflow-x: auto; }
.plain { width: 100%; border-collapse: collapse; margin-top: 7px; font-size: 14px; }
.plain td { padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.plain td:first-child { white-space: nowrap; }

/* VESTA */
.rail { display: flex; gap: 3px; margin-top: 14px; overflow-x: auto; padding-bottom: 3px; scrollbar-width: thin; }
.rail li { flex: 1 0 76px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 7px 3px; text-align: center; font-size: 12.5px; line-height: 1.15; color: var(--muted); background: var(--raised); border: 1px solid var(--line); border-radius: 8px; transition: all .25s; }
.rail i { font: 500 12px var(--mono); font-style: normal; }
.rail li.done { color: var(--text); border-color: rgba(255, 122, 47, .45); }
.rail li.done i { color: var(--ember-soft); }
.rail li.on { color: #1b0d03; font-weight: 600; background: var(--ember); border-color: var(--ember); box-shadow: 0 0 18px rgba(255, 122, 47, .5); }
.rail li.skip { opacity: .4; }
.chat-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 12px; }
.mode-e .chat-wrap { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.chat { height: 400px; overflow-y: auto; padding: 14px; background: #090e1a; border: 1px solid var(--line); border-radius: 12px; }
.bubble { font-size: 14.5px; }
.bubble.you { width: fit-content; max-width: 85%; margin-left: auto; padding: 7px 12px; background: rgba(255, 122, 47, .18); border: 1px solid rgba(255, 122, 47, .35); border-radius: 12px 12px 3px 12px; }
.bubble.her { display: flex; gap: 10px; margin-top: 12px; }
.orb { flex: none; width: 26px; height: 26px; margin-top: 2px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe4cc, var(--ember) 55%, #6a2505); box-shadow: 0 0 14px rgba(255, 122, 47, .7); animation: orb 3s ease-in-out infinite; }
@keyframes orb { 50% { box-shadow: 0 0 22px rgba(255, 122, 47, 1); transform: scale(1.07); } }
.body { min-width: 0; flex: 1; }
.badge-line { display: inline-block; font: 500 12.5px var(--mono); color: var(--ember-soft); }
.badge-line:empty { display: none; }
.tool-steps { margin: 6px 0; display: grid; gap: 3px; font-size: 13.5px; }
.tool-steps li { display: flex; flex-wrap: wrap; gap: 2px 7px; align-items: baseline; padding: 4px 8px; background: var(--raised); border-radius: 7px; }
.tool-steps span { color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.tool-steps .ok { color: var(--ok); font-style: normal; }
.tool-steps .err { color: var(--bad); font-style: normal; }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--line); border-top-color: var(--ember); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.answer { overflow-wrap: anywhere; }
.chiplet { width: fit-content; margin-top: 6px; padding: 2px 9px; font-size: 13px; background: var(--raised); border: 1px solid var(--line); border-radius: 7px; color: var(--muted); }
.srcs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 9px; font-size: 12.5px; }
.srcs b { color: var(--muted); font-weight: 500; }
.srcs span { padding: 1px 6px; font-family: var(--mono); color: var(--ember-soft); background: rgba(255, 122, 47, .09); border-radius: 4px; overflow-wrap: anywhere; }
.conf-line { margin-top: 8px; font-size: 13.5px; color: var(--muted); }
.log { height: 400px; overflow-y: auto; padding: 12px; background: #05080f; border: 1px solid var(--line); border-radius: 12px; font: 400 12px/1.45 var(--mono); color: var(--muted); }
.log div { margin-bottom: 7px; overflow-wrap: anywhere; }
.log b { color: var(--spice); font-weight: 500; }
.actions { margin-top: 12px; }
.brains { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.brains article { padding: 14px; background: var(--raised); border: 1px solid var(--line); border-radius: 11px; font-size: 14.5px; }
.brains h4 { font-size: 16.5px; }
.brains ol { display: grid; gap: 5px; margin-top: 10px; padding-left: 19px; list-style: decimal; color: var(--muted); }
.brains article > p { margin-top: 10px; color: var(--muted); }
.loop { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 10px; font: 500 12.5px var(--mono); }
.loop span { padding: 3px 8px; background: var(--bg); border: 1px solid #2b3a5c; border-radius: 6px; }
.loop i { color: var(--ember); font-style: normal; }
.toolgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 9px; }
.tool { padding: 11px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; transition: border-color .3s, box-shadow .3s; }
.tool h4 { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font: 400 13.5px var(--mono); }
.tool small { flex: none; font: 400 11.5px var(--body); color: var(--muted); }
.tool p { font-size: 14px; color: var(--muted); margin-top: 3px; }
.tool .tool-desc { font-size: 12.5px; opacity: .85; }
.tool.used { border-color: var(--ember); box-shadow: 0 0 16px rgba(255, 122, 47, .35); }
.ground { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.ground li { padding: 12px; background: var(--raised); border: 1px solid var(--line); border-top: 3px solid var(--line); border-radius: 10px; font-size: 14px; overflow-wrap: anywhere; transition: opacity .5s, transform .5s; }
.ground h4 { font-size: 15px; margin-bottom: 5px; }
.ground li.wait { opacity: 0; transform: translateY(10px); }
.ground .is-bad { border-top-color: var(--bad); }
.ground .is-catch { border-top-color: var(--warn); }
.ground .is-good { border-top-color: var(--ok); }
.bad-n { color: var(--bad); font: 500 1.1em var(--mono); text-decoration-thickness: 2px; }
.engines { display: flex; align-items: stretch; gap: 0; margin-top: 12px; overflow-x: auto; padding: 6px 3px; }
.eng { flex: 1 0 104px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; min-height: 76px; padding: 8px 6px; text-align: center; background: var(--raised); border: 1px solid #2b3a5c; border-radius: 10px; transition: all .3s; }
.eng b { font: 600 14.5px var(--head); }
.eng small { font-size: 12.5px; color: var(--muted); }
.eng span { font: 400 11px/1.2 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
button.eng:hover { border-color: var(--ember); }
.eng.s-nokey { opacity: .5; border-style: dashed; }
.eng.s-limit small { color: var(--warn); }
.eng.miss { border-color: var(--bad); background: rgba(255, 93, 108, .1); }
.eng.hit { border-color: var(--ok); background: rgba(94, 230, 168, .12); box-shadow: 0 0 20px rgba(94, 230, 168, .35); opacity: 1; }
.link { flex: 0 0 16px; align-self: center; height: 2px; background: #2b3a5c; }
.result { margin-top: 12px; padding: 12px; min-height: 86px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; font-size: 14.5px; }
.r-title { font-size: 12.5px; color: var(--muted); }
.fall-note { margin-top: 2px; }
.demo { margin-top: 10px; padding: 8px 11px; border: 1px dashed var(--warn); border-radius: 8px; font-size: 13.5px; color: var(--muted); }
.demo b { margin-right: 5px; padding: 0 6px; background: var(--warn); color: #1b1303; border-radius: 4px; font: 600 12px var(--mono); }

/* honesty */
.confs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.conf-card { padding: 12px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; }
.conf-card p { margin-top: 7px; font-size: 14.5px; color: var(--muted); }
.rules { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
.rule { display: flex; flex-direction: column; padding: 14px; background: rgba(13, 19, 34, .9); border: 1px solid var(--line); border-radius: 12px; }
.rule > i { font: 500 13px var(--mono); color: var(--ember-soft); font-style: normal; }
.rule h4 { font-size: 16px; margin-top: 2px; }
.rule > p:not(.rule-links) { flex: 1; font-size: 14px; color: var(--muted); margin: 5px 0 9px; }
.rule-links { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; margin-top: 4px; }
.rule-links span { width: 100%; font-size: 12px; color: var(--muted); }
.rule .file { font-size: 11.5px; }

/* ship */
.ship .step small { display: block; }
.vault { display: grid; gap: 7px; }
.vault li { position: relative; padding: 9px 11px; background: var(--raised); border: 1px solid var(--line); border-radius: 9px; font-size: 14px; }
.vault b { display: block; font: 600 14.5px var(--head); }
.vault span { color: var(--muted); }
.vault li:last-child { border-color: var(--ok); }
.tests { display: grid; gap: 5px; }
.tests li { display: grid; grid-template-columns: 90px minmax(0, 1fr) 30px; gap: 8px; align-items: center; }
.tests .file { border: 0; background: none; padding: 0; color: var(--text); font-size: 12.5px; }
.tbar { display: block; height: 8px; background: #111a2d; border-radius: 3px; overflow: hidden; }
.tbar i { display: block; height: 100%; background: var(--ember); border-radius: 0 4px 4px 0; }
.tests b { font: 500 13px var(--mono); text-align: right; }
.deps { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 14px; margin-top: 8px; }
.deps li { display: flex; flex-wrap: wrap; gap: 0 7px; align-items: baseline; font-size: 14px; }
.deps b { font: 500 13px var(--mono); }
.deps span { width: 100%; color: var(--muted); font-size: 13.5px; }

/* growth */
.cmds { display: grid; gap: 5px; margin-top: 12px; }
.cmds li { display: flex; flex-wrap: wrap; gap: 3px 12px; align-items: baseline; padding: 7px 10px; background: #05080f; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }

.cmds span { color: var(--muted); }

.changes span { padding: 1px 7px; font-family: var(--mono); border-radius: 5px; }
.add { color: var(--ok); background: rgba(94, 230, 168, .1); }
.rem { color: var(--bad); background: rgba(255, 93, 108, .1); }
.timeline { position: relative; display: grid; gap: 9px; padding-left: 18px; margin-top: 8px; }
.timeline::before { content: ""; position: absolute; left: 4px; top: 5px; bottom: 5px; width: 2px; background: var(--line); }
.timeline li { position: relative; display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 8px; font-size: 14.5px; }
.timeline li::before { content: ""; position: absolute; left: -18px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--raised); border: 2px solid #3a4b70; }
.timeline li.phase::before { background: var(--ember); border-color: var(--ember); }
.timeline time { font: 400 13px var(--mono); color: var(--muted); padding-top: 1px; }
.timeline code { font-size: 12px; color: var(--muted); }
.foot { margin: 48px 0 28px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.foot-links { display: flex; gap: 8px; margin-top: 8px; }

/* medium screens */
@media (max-width: 1080px) {
  .stats { grid-template-columns: repeat(4, 1fr); }
  .rules { grid-template-columns: repeat(2, 1fr); }
  .ground { grid-template-columns: repeat(2, 1fr); }

}

}

  .map { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 18px; grid-template-areas: "nasa ingest" "brains clean" "tools vesta" "api engines" "pages you" "repo vercel"; }

  .rail li { flex-basis: 70px; }

":"nearest_tests","description":"Find the NASA tests closest to given conditions (O2 %, pressure psi, optional airflow cm/s), using a normalised distance where 1.0 = edge of the ±5 pp O2 / ±2.5 psi envelope.","kind":"data","file":"lib/vesta/tools/nearest_tests.ts"},{"name":"envelope_check","description":"Is a condition inside the tested data envelope? supported = at least 5 NASA tests within ±5 percentage points O2 and ±2.5 psi; sparse = 1-4; no_data = 0. Also returns the 3 nearest tests.","kind":"data","file":"lib/vesta/tools/envelope_check.ts"},{"name":"compare","description":"Compare 2 or 3 investigations (ACME, CFI, SPICE): attributes shared by all, attributes only in one, and O2 / pressure / flow statistics per investigation.","kind":"data","file":"lib/vesta/tools/compare.ts"},{"name":"rank_investigations","description":"Rank ACME, CFI and SPICE by relevance to a mission or condition (score 0-100 = proximity 40 + O2 coverage 20 + pressure coverage 20 + tests in envelope 20). Returns every score part with its reason.","kind":"data","file":"lib/vesta/tools/rank_investigations.ts"},{"name":"gap_finder","description":"Find what the NASA data does NOT cover: empty O2 x pressure cells (especially mission cells and the exploration region 21-50% O2 below 14 psi), missing fuel phases (e.g. solids), untested gravity levels, and the experiments that would fill each gap.","kind":"data","file":"lib/vesta/tools/gap_finder.ts"},{"name":"safety_audit","description":"Fire-safety audit for a mission or condition: Prevention / Detection / Suppression findings (oxygen enrichment, barely tested cabin materials, cool flames, smoke detection, still air and flow control, partial gravity), each with a heuristic severity 0-100, evidence from the NASA data, sources, its own confidence and an 'evidence suggests' guideline.","kind":"data","file":"lib/vesta/tools/safety_audit.ts"},{"name":"will_it_burn","description":"Check a SOLID material in a cabin against NASA's BASS-II microgravity tests: acrylic (PMMA) sheets, SIBAL cotton-fibreglass fabric and Nomex, tested in the ISS glovebox. A test counts only if its own row records every condition given, together; nothing is interpolated or extrapolated. Returns the verdict (burned, mixed, no-burn = no flame held, no-data, unresolved = unclear), the matching test ids, each condition check, the closest tests and sourced gaps. It reports what NASA observed in those rows. It is never a prediction and never a safety rating. Use it for any question about a solid material or fabric, or 'will it burn'. Pass the user's own question, and add explicit conditions only when the user gave them.","kind":"data","file":"lib/vesta/tools/will_it_burn.ts"},{"name":"make_chart","description":"Draw a chart in the chat (line, bar, scatter, radar or heatmap, max 2000 points). Use ONLY numbers that came from earlier tool results in this conversation; anything else is rejected. Give categories for bar/line/radar/heatmap, points for scatter, cells for heatmap.","kind":"action","file":"lib/vesta/tools/make_chart.ts"},{"name":"ui_action","description":"Move the FlameScope dashboard: go_view (overview, explorer, compare, safety, burn = Will it burn?, lab, dataset, simulator, about), set_mission, highlight_tests on the map, or open_test details. Use it whenever the answer is easier to see on a page.","kind":"action","file":"lib/vesta/tools/ui_action.ts"}],"routes":[{"path":"/api/burn/ask","methods":["GET"],"libs":["lib/burn.ts"],"data":[],"file":"app/api/burn/ask/route.ts"},{"path":"/api/burn/data","methods":["GET"],"libs":["lib/burn.ts"],"data":[],"file":"app/api/burn/data/route.ts"},{"path":"/api/calc","methods":["POST"],"libs":["lib/data.ts","lib/physics.ts"],"data":["data/processed/chunks.json","data/processed/pdf_tables.json","data/processed/tests.json"],"file":"app/api/calc/route.ts"},{"path":"/api/compare","methods":["GET"],"libs":["lib/analysis.ts","lib/bins.ts","lib/data.ts","lib/missions.ts","lib/physics.ts","lib/ratelimit.ts" :"Hazard first: oxygen is enriched to 34%, 1.619× Earth air (+13 points).\nAt Pressurized lunar rover (demo scenario) conditions (34% O2, 8.2 psi), pO2 = 2.788 psi, which is 0.903× the ISS value of 3.087 psi (lib/physics.ts).\nData envelope (gas and droplet tests): supported — 28 NASA tests lie within the window (ACME 28); rule: supported: ≥5 gas or droplet tests within ±5 pp O2 and ±2.5 psi; sparse: 1–4; no_data: 0.\nNearest test: ACME-CFIG-128 at 34.081% O2 and 7.348 psi, distance 0.341 (ACME_Experimental_Table.csv row 129).\nEvidence suggests caution: the nearby tests are gas flames only, so they say nothing about cabin materials. For a solid material, ask me about it by name (for example \"Will acrylic burn on the ISS?\").\nAll three investigations ran in microgravity; lunar gravity is untested. LUCI or FM2-type experiments at lunar gravity would close that gap.\nSafety audit (evidence, not NASA rules; severity is a FlameScope heuristic 0–100):\n• Prevention — Cabin materials are barely tested (severity 80, no data): Evidence is missing: no solid material has a test at 34% O2 and 8.2 psi. The only solid-material tests here (acrylic, SIBAL fabric, Nomex) ran in the station's glovebox at up to 22.2% O2. BASS / Saffire-type material flammability tests at these conditions would fill this gap.\n• Suppression — Lunar gravity is untested (severity 65, no data): Evidence is missing for lunar gravity: every test in this data ran in microgravity, with none at Earth gravity or in partial gravity, so nothing here bounds flame or suppressant behaviour on the Moon. LUCI or FM2-type experiments at lunar gravity would fill this gap.\n• Detection — Smoke and soot behaviour (severity 50, extrapolated): Evidence suggests sooting depends on fuel and airflow, but SPICE ran only at 21% O2 and 101 kPa: smoke-detector response at 34% O2 and 8.2 psi is untested.\n• Suppression — Still-air pockets and flow control (severity 45, extrapolated): Evidence suggests cutting fuel or oxidizer flow ends gas flames (89 ACME cases), and that quiescent air lets these gas flames self-extinguish. That holds for gas flames only. For solid materials it cannot be assumed: NASA's Saffire results, quoted under Fire response on the Will it burn? page, include a fabric flame that kept burning with the fan off.\n• Detection — Cool flames are hard to see (severity 40, extrapolated): Evidence suggests a cool flame can keep burning after the bright hot flame goes out, with little light or heat; detectors that rely on visible flame or high temperature may miss it.\n• Prevention — Oxygen enrichment: 34% O2 (severity 31, supported): Evidence suggests minimising ignition sources and flammable items at 34% O2: 23 of 28 tested gas flames near these conditions ignited.","pieces":107},{"type":"sources","sources":[{"file":"lib/physics.ts","note":"tested formula (tests/physics.test.ts)"},{"file":"Pseudo_DataKeep/ACME/ACME_Experimental_Table.csv","row":33,"test_id":"ACME-CFIG-032"},{"file":"Pseudo_DataKeep/ACME/ACME_Experimental_Table.csv","row":34,"test_id":"ACME-CFIG-033"},{"file":"Pseudo_DataKeep/ACME/ACME_Experimental_Table.csv","row":35,"test_id":"ACME-CFIG-034"},{"file":"Pseudo_DataKeep/ACME/ACME_Experimental_Table.csv","row":36,"test_id":"ACME-CFIG-035"},{"file":"Pseudo_DataKeep/ACME/ACME_Experimental_Table.csv","row":37,"test_id":"ACME-CFIG-036"},{"file":"Pseudo_DataKeep/ACME/ACME_Experimental_Table.csv","row":38,"test_id":"ACME-CFIG-037"},{"file":"Pseudo_DataKeep/ACME/ACME_Experimental_Table.csv","row":39,"test_id":"ACME-CFIG-038"},{"file":"Pseudo_DataKeep/ACME/ACME_Experimental_Table.csv","row":40,"test_id":"ACME-CFIG-039"},{"file":"Pseudo_DataKeep/ACME/ACME_Experimental_Table.csv","rows":"33–40, 126–131, 153–157, 194–196, 215, 272, 276, 324–325, 334","note":"28 rows"},{"file":"Pseudo_DataKeep/ACME/ACME_Experimental_Table.csv","row":129,"test_id":"ACME-CFIG-128"},{"file":"Pseudo_DataKeep/ACME/ACME_Experimental_Table.csv","row":130,"test_id":"ACME-CFIG-129"}]},{"type":"confi 9-23","subject":"Make Will It Burn? the home page; add feature list"},{"hash":"02effad","date":"2026-09-23","subject":"Merge pull request #2 from ShuvroShimuL/will-it-burn"},{"hash":"7ccb8bb","date":"2026-09-23","subject":"Restructure into Space Apps layout; add planning docs, agent rules and MCP server"},{"hash":"d7a11e3","date":"2026-09-23","subject":"Merge pull request #1 from ShuvroShimuL/will-it-burn"},{"hash":"d493c4e","date":"2026-09-23","subject":"Add Will It Burn?, a question-first view on the BASS-II tests"},{"hash":"e7ba1d0","date":"2026-09-21","subject":"Initial commit"}],"changes":[{"date":"2026-11-12","added":["page /burn","route /api/burn/ask","route /api/burn/data","tool will_it_burn","module lib/burn.ts"],"removed":[]},{"date":"2026-11-12","added":["route /api/vesta/meter","engine openai","engine freellmapi"],"removed":[]}],"stories":{"hero":{"eyebrow":"Team Polaris · The working blueprint","title":"How FlameScope works","lead":{"s":"Follow one idea all the way through: real NASA fire experiments go in one end, and a crewmate who can back up every number comes out the other. Click anything. Nothing here is a mock-up.","e":"An end-to-end map of the system, generated from the repository: data ingest, static data layer, API routes, the VESTA agent and deployment. Facts and recordings are produced by running the real modules at scan time."},"stats":[{"fact":"testsCounted","label":"NASA tests"},{"fact":"chunks","label":"PDF passages"},{"fact":"pageCount","label":"Pages"},{"fact":"routeCount","label":"API routes"},{"fact":"toolCount","label":"VESTA tools"},{"fact":"engineCount","label":"AI + backup engines"},{"fact":"testBlocks","label":"Test blocks"}]},"sections":{"map":{"nav":"The machine","eyebrow":"Start here","title":"The whole machine on one screen","intro":{"s":"The moving dots are data on its way to you. Click any box to see what it does and which files do the work.","e":"The moving dots are data on its way to you. Click any box to see what it does and which files do the work."}},"journey":{"nav":"Data journey","eyebrow":"Step one · From NASA to clean data","title":"Messy files in, trustworthy records out","intro":{"s":"NASA's files were written by scientists, for scientists. Different units, odd columns, a few repeated rows. A cleaning script turns them into one tidy format and never forgets where each value came from.","e":"`scripts/ingest/ingest.py` is an offline, one-shot job with one adapter per investigation. It writes committed JSON under `data/processed/`. Vercel never runs Python; every field mapping is recorded in `docs/DATA_NOTES.md`."}},"storage":{"nav":"The “database”","eyebrow":"Step two · Where the data lives","title":"The database that isn't a database","intro":{"s":"There's no database server to crash or pay for. The clean data is plain files shipped with the website, loaded into memory the first time they're needed. Fast, simple, and every change is visible in the project's history.","e":"JSON is imported at build time and bundled with the server functions. `lib/data.ts` validates it once with zod and caches it per instance; `lib/search.ts` builds a MiniSearch index lazily. The data is read-only at runtime, so there is no write path to protect."}},"features":{"nav":"Every feature","eyebrow":"Step three · What you see","title":"Pick a page. Watch where its data comes from.","intro":{"s":"Every page follows the same trail: the page asks an API route, the route asks a “brain” in the code, and the brain reads the clean data. These trails are traced from the real code.","e":"Edges come from walking the import graph from each `page.tsx` and `route.ts`, plus `/api/...` strings found in reached files. `import type` is ignored because it is erased at build time. A solid line is a call to the server; a dashed line is a module the page uses directly, with no API call. Importing only a constant from a component does not count as using it."}},"vesta":{"nav":"How VESTA answers","eyebrow":"Step four · The crewmate","title":"How VESTA answers a question","intro":{"s":"VESTA isn't allowed to answer from memory. It has to use tools that read the NASA data, and a checker reads its answer before you do. Pick a question and watch a real answer being built.","e":"A provider-agnostic tool loop runs behind a fallback router. Every engine shares one system prompt, one zod-defined tool set and one grounding check, and emits the same SSE events."}},"honesty":{"nav":"Honesty rules","eyebrow":"The promises","title":"Rules the code enforces","intro":{"s":"FlameScope makes promises about fire safety, so they can't just be good intentions. Each promise below points to the code that keeps it and the test that checks it.","e":"FlameScope makes promises about fire safety, so they can't just be good intentions. Each promise below points to the code that keeps it and the test that checks it."}},"ship":{"nav":"Going live","eyebrow":"Step five · Reaching the world","title":"From a code change to the live site","intro":{"s":"The site is built to rebuild itself from GitHub: once the repository is connected to a host, each push to the main branch builds a new version, and a failed build leaves the previous one online.","e":"Designed for Vercel's Git integration on `main`; nothing in the repository deploys by itself. Route handlers run as Node functions, static assets go to the CDN, and keys exist only in server-side environment variables."}},"growth":{"nav":"How it grew","eyebrow":"The living part","title":"This page keeps itself up to date","intro":{"s":"Nobody has to remember to update this page. A scanner re-reads the project on every build, so new pages, tools and numbers appear here by themselves, and anything it can't explain gets flagged.","e":"`scripts/blueprint/scan.ts` imports the real modules and produces a manifest, which `render.ts` embeds into one self-contained HTML file. It runs as an npm `prebuild` step and can never fail a deploy. `pipeline-watch.ts` fingerprints the key files so that a logic change flags its explanation for review."}}},"mapNodes":{"nasa":{"label":"NASA data keep","sub":"9 raw files","jump":"journey","story":{"s":"The starting point: real tables and reports from three NASA experiments on the Space Station. We only ever read these files. We never change them.","e":"`Pseudo_DataKeep/{ACME,CFI,SPICE}/`: 3 CSV tables and 6 PDFs (357 pages). Read-only and committed to git. Checksums live in `sources.json`."},"files":["Pseudo_DataKeep","docs/DATA_NOTES.md"]},"ingest":{"label":"The cleaner","sub":"ingest.py","jump":"journey","story":{"s":"A Python script that reads the messy files, fixes the units, spots repeated rows and cuts the PDFs into small searchable passages. It only runs when the raw data changes.","e":"pandas for tables, pymupdf for page text, pdfplumber for tables. One adapter per investigation, then duplicate marking and range checks. Output is committed, so deploys need no Python."},"files":["scripts/ingest/ingest.py","scripts/ingest/describe_sources.py","scripts/ingest/tests/test_ingest.py"]},"clean":{"label":"Clean files","sub":"889 rows · 1066 passages","jump":"storage","story":{"s":"The tidy result, and FlameScope's “database”. Plain files that travel with the website, so there's no server that can go down.","e":"`data/processed/`: tests, chunks, PDF tables, source checksums and the ingest report. Every test record carries `source_file` and `source_row`."},"files":["data/processed/tests.json","data/processed/chunks.json","data/processed/pdf_tables.json","data/processed/ingest_report.md"]},"brains":{"label":"The brains","sub":"18 lib modules","jump":"features","story":{"s":"Where the thinking happens: tested formulas, rankings, safety rules and search. Nothing is guessed here. It's all maths and lookups on real data.","e":"Pure TypeScript modules under `lib/`: the data layer, physics, analysis, safety rules, search and flame evidence. API routes and VESTA's tools share them, so both always agree."},"files":["lib/data.ts","lib/physics.ts","lib/analysis.ts","lib/safety.ts","lib/search.ts"]},"api":{"label":"API routes","sub":"18 doors","jump":"features","story":{"s":"The doors between the website and the brains. A page knocks, asks for something specific, and gets back just that.","e":"Next.js Route Handlers on the Node runtime. GET responses are cached at the edge for 10 minutes. `docs/API.md` documents the contract."},"files":["app/api","docs/API.md","lib/api.ts"]},"pages":{"label":"Dashboard","sub":"9 pages","jump":"features","story":{"s":"What you actually see: maps, tables, comparisons and the flame simulator. Choosing a mission here changes the whole dashboard, and VESTA too.","e":"Next.js App Router pages with shared client state in zustand (`lib/store.ts`). ECharts for charts, three.js loaded on demand for the 3D map, WebGL for the flame."},"files":["app","components","lib/store.ts"]},"you":{"label":"You","sub":"student → engineer","jump":"vesta","story":{"s":"Students, professors and engineers. Ask VESTA in plain words, and pick how technical the answer should be.","e":"Three explanation levels (student, researcher, engineer) are sent with each message and change the system prompt. Preferences persist in localStorage."},"files":["components/vesta/VestaPanel.tsx","components/vesta/useVesta.ts"]},"tools":{"label":"VESTA's tools","sub":"12 tools","jump":"vesta","story":{"s":"VESTA's hands. Each tool does one job, like checking conditions or finding gaps. The tools use the same brains as the rest of the site, so VESTA and the dashboard always agree.","e":"One file per tool in `lib/vesta/tools/`. Schemas are written once in zod and converted for each provider. `runTool` validates the arguments and never throws."},"files":["lib/vesta/tools/index.ts","lib/vesta/tools/schemas.ts"]},"vesta":{"label":"VESTA","sub":"AI crewmate","jump":"vesta","story":{"s":"The crewmate who explains it all. VESTA can also move the dashboard around for you, and it speaks first when it spots a hazard.","e":"`lib/vesta/agent.ts` runs the tool loop (at most 6 rounds) and `grounding.ts` verifies the numbers. Results stream as Server-Sent Events from `/api/vesta`."},"files":["lib/vesta/agent.ts","lib/vesta/grounding.ts","lib/vesta/system-prompt.md","app/api/vesta/route.ts"]},"engines":{"label":"Backup chain","sub":"6 AI + Offline","jump":"chain","story":{"s":"If one AI service is busy or down, VESTA quietly moves to the next. The last in line needs no AI at all, so VESTA always has an answer.","e":"`lib/vesta/router.ts` walks the chain on a missing key, auth errors, rate limits, server errors, timeouts or bad tool output, and failed engines cool down. Offline is rule-based and needs no network."},"files":["lib/vesta/router.ts","lib/vesta/engines.ts","lib/vesta/offline.ts","lib/vesta/providers"]},"repo":{"label":"GitHub","sub":"branch main","jump":"ship","story":{"s":"The project's home. The code and the clean data live here together, with a full history of every change.","e":"Code, raw data and processed data are all versioned together. When the repository is connected to a host, pushing to `main` triggers a production deployment."},"files":["AGENTS.md","docs/integration/MIGRATION_PLAN.md"]},"vercel":{"label":"Vercel","sub":"builds + hosts","jump":"ship","story":{"s":"Takes the code from GitHub, builds the site and puts it online. It also keeps the secret keys safe, away from your browser.","e":"`npm run build` runs the blueprint scan, then `next build`. API routes become Node functions with a 60 second limit on `/api/vesta`. A failed build leaves the previous deployment live."},"files":["next.config.mjs","package.json"]}},"investigations":{"ACME":{"title":"Gas flames","story":{"s":"Flames fed by gaseous fuel, burning as glowing spheres in microgravity. This set spans the widest range of oxygen and pressure, which makes it the closest match for future habitats.","e":"Flames fed by gaseous fuel, burning as glowing spheres in microgravity. This set spans the widest range of oxygen and pressure, which makes it the closest match for future habitats."}},"CFI":{"title":"Burning droplets","story":{"s":"Single fuel droplets burning in mid-air, including strange “cool flames” that keep going at far lower temperatures than an ordinary flame.","e":"Single fuel droplets burning in mid-air, including strange “cool flames” that keep going at far lower temperatures than an ordinary flame."}},"SPICE":{"title":"Smoke points","story":{"s":"Small jet flames in a gentle stream of air, measuring when a flame starts to make smoke. Smoke is what fire detectors look for.","e":"Small jet flames in a gentle stream of air, measuring when a flame starts to make smoke. Smoke is what fire detectors look for."}}},"ingestSteps":[{"id":"read","label":"Read","story":{"s":"Open each NASA table and remember its exact row number.","e":"`read_csv` loads each table and stores the spreadsheet row in `__row`, so every record can cite its source."}},{"id":"adapt","label":"Translate","story":{"s":"Each experiment has its own layout, so each gets its own translator into one shared format.","e":"`adapt_acme`, `adapt_cfi` and `adapt_spice` map to one record model. ACME inverse-flame rows use a shifted column layout and get the flag `layout_shifted`."}},{"id":"units","label":"Fix units","story":{"s":"NASA used bar, atm, kPa and fractions. Everything becomes psi and percent, so values can be compared fairly.","e":"bar × 14.5038, atm × 14.6959, kPa × 0.145038, fraction × `100`. The original units are recorded in `DATA_NOTES.md`."}},{"id":"unknown","label":"Never guess","story":{"s":"If a value is missing, it stays empty. No filling in, no best guesses.","e":"`num()` maps blanks, dashes and text to `null`. SPICE O2 and pressure come from its report, not per-row data, and carry the flag `conditions_from_doc`."}},{"id":"flag","label":"Flag problems","story":{"s":"Repeated rows are marked so they never count twice, and impossible values are reported. Nothing is silently deleted.","e":"`mark_duplicates` flagged 42 rows, excluded from statistics by `isCountable`. `run_checks` found 8 range failures, all listed in `ingest_report.md`."}},{"id":"chunk","label":"Slice PDFs","story":{"s":"Long reports are cut into short passages so VESTA can find the right paragraph and cite its page.","e":"Page-aware chunks of about 800 characters with 100 overlap, cut at sentence ends where possible. pdfplumber extracts tables separately."}},{"id":"write","label":"Save","story":{"s":"The clean files are saved and committed with the code, along with a report card of the run.","e":"Writes `tests.json`, `chunks.json`, `pdf_tables.json` and `ingest_report.md`. `describe_sources.py` adds `sources.json` with checksums."}}],"split":{"title":"The split: one pile becomes three","story":{"s":"Different kinds of information need different handling, so the raw files split into three clean collections, each with its own job.","e":"CSV rows become structured records for filtering and statistics. PDF prose becomes passages for full-text search. PDF tables are stored separately with file and page."},"lanes":[{"key":"rows","file":"tests.json","title":"Test records","from":"from the CSV tables","use":"Filters, charts, rankings, safety rules"},{"key":"chunks","file":"chunks.json","title":"PDF passages","from":"from the PDF text","use":"VESTA's search_docs, the test details drawer"},{"key":"tables","file":"pdf_tables.json","title":"PDF tables","from":"from tables inside the PDFs","use":"Downloads and the Dataset page"}],"equation":{"s":"Why two totals? NASA's tables hold 889 rows, but 42 are exact repeats. They stay visible and flagged, but only 847 are ever counted.","e":"Why two totals? NASA's tables hold 889 rows, but 42 are exact repeats. They stay visible and flagged, but only 847 are ever counted."}},"rawClean":{"title":"Watch one real row get cleaned","story":{"s":"This is an actual row from the NASA table next to the record FlameScope keeps. Pick an experiment and press the button.","e":"This is an actual row from the NASA table next to the record FlameScope keeps. Pick an experiment and press the button."}},"chunkDemo":{"title":"How a PDF gets sliced","story":{"s":"Neighbouring passages share a little text, so a sentence is never lost at a cut. These are two real passages. The orange text is the part they share.","e":"Two consecutive chunks from `chunks.json`. The shared span comes from the 100 character overlap in `chunk_page`, adjusted by the cut at a sentence or line end."}},"storageSteps":[{"title":"Shipped with the site","story":{"s":"The clean files travel inside the website's own code.","e":"Static JSON imports in `lib/data.ts`, bundled into the server functions."}},{"title":"Checked once","story":{"s":"On first use, every record is checked for the right shape.","e":"`z.array(TestRecordSchema).parse()` runs once per instance and fails loudly if the data is malformed."}},{"title":"Kept in memory","story":{"s":"After that, the data sits in memory and answers instantly.","e":"Module-level arrays and a `Map` by test ID. Pure computations are memoised with `memo()` in `lib/ratelimit.ts`."}},{"title":"Searched by word","story":{"s":"PDF passages get an index, like the one at the back of a book.","e":"MiniSearch inverted index with prefix and fuzzy matching, built lazily on first search."}}],"envelope":{"title":"Try it: has anyone tested this?","story":{"s":"Slide the oxygen and pressure. The box shows which NASA tests are close enough to count as evidence. This is the same rule VESTA follows, running on the same data.","e":"A browser copy of `envelopeCheck` from `lib/physics.ts`, run over the embedded counted tests. `tests/blueprint.test.ts` checks that it matches the real function."},"rule":{"s":"At least 5 tests within ±5 points of O2 and ±2.5 psi is **supported**. Between one and 4 is **sparse**. None is **no data**, and VESTA won't predict there.","e":"At least 5 tests within ±5 points of O2 and ±2.5 psi is **supported**. Between one and 4 is **sparse**. None is **no data**, and VESTA won't predict there."}},"pages":{"/":{"story":{"s":"Home base. Choose a mission and see how close NASA's tests come to it on the map, in 3D or flat, and which experiment matters most.","e":"`HabitatMap` plots `/api/map`, with a lazy three.js scene and flat ECharts fallback. `RankBars` reads `/api/rank`. `MissionHeader` posts to `/api/calc`."},"try":"Switch the mission and watch VESTA speak first."},"/explorer":{"story":{"s":"Every NASA test in one searchable table. Open any row to see its details and exactly where it came from.","e":"Server-side filter, sort and paging through `/api/tests`. `TestDrawer` loads `/api/tests/[id]` with derived values and related PDF passages."},"try":"Filter by fuel, then open a row."},"/compare":{"story":{"s":"Put experiments side by side: what they share, how they differ, and how much of the habitat range each one covers.","e":"`/api/compare` returns shared and unique attributes, condition stats and the coverage radar. `/api/map` supplies the overlay."},"try":"Pick two experiments and read the radar."},"/safety":{"story":{"s":"What the evidence suggests for prevention, detection and suppression, plus the conditions nobody has tested yet.","e":"`lib/safety.ts` rules run real queries and return severity, confidence and sources. `findGaps` builds the O2 × pressure coverage grid. Severity is a FlameScope heuristic, not a NASA rating."},"try":"Find the empty cells in the gap grid."},"/burn":{"story":{"s":"Ask whether a solid material burns in a cabin and see what NASA actually recorded: the matching test rows, or the gap that stops an answer. It never predicts and never rates safety.","e":"`BurnView` sends the question or tapped conditions to `/api/burn/ask` and lays out the JSON. `lib/burn.ts` fronts the rule-based evidence engine in `lib/evidence`, which counts a test only when its own row records every given condition. `/api/burn/data` serves the acrylic rows, the ranked findings and the fire-response steps quoted from NASA. No model is involved, and these rows are never pooled with the gas and droplet table."},"try":"Ask about a Moon base, then read the gaps."},"/lab":{"story":{"s":"Enter your own conditions or upload your own data and compare it with NASA's. Your file stays in your browser, and the live telemetry is clearly marked as a demo.","e":"`lib/csv.ts` parses and maps uploads client-side into memory only, never mixed with NASA rows. `/api/calc` returns pO2, the envelope, a heuristic hazard index and nearest tests. `DemoTelemetry` is labelled DEMO."},"try":"Upload the sample CSV."},"/dataset":{"story":{"s":"The full story of the data: where it came from, how it's organised, its limits, and how to download it.","e":"A server component using `lib/dataset.ts` for computed statistics. `/api/dataset/[file]` serves force-static exports, and `lib/dataset-split.ts` builds leak-safe train/test splits for other people's modelling."},"try":"Compare a raw row with its clean record."},"/simulator":{"story":{"s":"Change the oxygen, pressure and fuel, then press Ignite. The result follows real NASA tests near your settings. The moving flame itself is artwork, and it's labelled DEMO.","e":"`/api/flame` serves compact rows so sliders respond instantly, and `lib/flame.ts` turns them into evidence and animation settings. Plain WebGL shader, not a combustion model."},"try":"Try Surprise me, then compare with Earth."},"every page":{"story":{"s":"These parts surround every page: the top bar, the navigation and VESTA's panel. That's why VESTA is one question away, wherever you are.","e":"`app/layout.tsx` wraps pages in `AppShell`. The trail shows what the shell reaches on its own, including all of VESTA through `useVesta`. Page trails stop at `useVesta` so an Ask VESTA button does not inflate them."},"try":"Change the mission and watch every page follow."},"/about":{"story":{"s":"Who built FlameScope, why, and how far its data can be trusted.","e":"Static page with the challenge goals, team, reference atmospheres and the DEMO policy."},"try":"Check the reference atmospheres table."}},"shell":{"components/layout/TopBar.tsx":{"title":"Top bar & mission chips","story":{"s":"The mission you pick here steers every page and VESTA at once. Shared state lives in one small store.","e":"The mission you pick here steers every page and VESTA at once. Shared state lives in one small store."}},"components/layout/SideNav.tsx":{"title":"Side navigation","story":{"s":"The list of pages. On small screens it moves to a sliding row at the top.","e":"The list of pages. On small screens it moves to a sliding row at the top."}},"components/layout/SiteFooter.tsx":{"title":"Footer","story":{"s":"Credits at the bottom of every page, plus the link that opens this Blueprint.","e":"Credits at the bottom of every page, plus the link that opens this Blueprint."}},"components/vesta/VestaPanel.tsx":{"title":"VESTA panel","story":{"s":"The chat on every page, with the level picker and the Engine room: pick an engine, watch which one is answering, the tokens it burns and the FreeLLMAPI fuel tank. It moves below the page on small screens.","e":"The chat on every page, with the level picker and the Engine room: pick an engine, watch which one is answering, the tokens it burns and the FreeLLMAPI fuel tank. It moves below the page on small screens."}},"components/ui/TestDrawer.tsx":{"title":"Test details drawer","story":{"s":"Opens one test with its derived values, source row and related PDF passages. VESTA can open it too.","e":"Opens one test with its derived values, source row and related PDF passages. VESTA can open it too."}},"components/ui/Tour.tsx":{"title":"First-visit tour","story":{"s":"A short guided tour for newcomers. Skip it once and it stays away.","e":"A short guided tour for newcomers. Skip it once and it stays away."}},"components/fx/SpaceBackdrop.tsx":{"title":"Space backdrop","story":{"s":"Decoration only. It never carries da <script>/* Pure browser copies of real rules. tests/blueprint.test.ts checks they match lib/physics.ts. */
var BPLogic = {
  pO2: function (o2, p) {
    return Math.round(((o2 / 100) * p) * 1000) / 1000;
  },
  ratioToIss: function (o2, p, issPo2) {
    return Math.round((BPLogic.pO2(o2, p) / issPo2) * 1000) / 1000;
  },
  envelope: function (points, o2, p, rule) {
    var inside = [];
    for (var i = 0; i < points.length; i++) {
      var t = points[i];
      if (Math.abs(t[1] - o2) <= rule.o2 && Math.abs(t[2] - p) <= rule.p) inside.push(t);
    }
    var n = inside.length;
    return { status: n >= rule.min ? "supported" : n > 0 ? "sparse" : "no_data", count: n, inside: inside };
  },
};
</script>

  var INV_IDS = ["ACME", "CFI", "SPICE"];
  var CONF = { supported: { c: "#5EE6A8", i: "✓", l: "supported" }, sparse: { c: "#FFC857", i: "~", l: "sparse" }, extrapolated: { c: "#FFC857", i: "~", l: "extrapolated" }, no_data: { c: "#FF5D6C", i: "∅", l: "no data" } };

  // ---------------------------------------------------------------- edges between elements
  function curve(a, b, sideways) {
    var ax = a.left + a.width / 2, ay = a.top + a.height / 2, bx = b.left + b.width / 2, by = b.top + b.height / 2;
    var dx = bx - ax, dy = by - ay, x1, y1, x2, y2, k;

      k = (x2 - x1) / 2;
      return "M" + x1 + " " + y1 + " C" + (x1 + k) + " " + y1 + " " + (x2 - k) + " " + y2 + " " + x2 + " " + y2;
    }
    x1 = ax; y1 = dy > 0 ? a.top + a.height : a.top; x2 = bx; y2 = dy > 0 ? b.top : b.top + b.height;

      if (!e.from || !e.to || !e.from.offsetParent || !e.to.offsetParent) return;

  // ---------------------------------------------------------------- data journey
  function journey() {
    var cards = INV_IDS.map(function (id) {

      }).join("");

    }).join("");

    var ch = M.chunkSample;
    var chunkHtml = "";

      '<div class="panel">' + panelHead(S.split.title, S.split.story) + '<div class="lanes">' + lanes + '</div><div class="equation" aria-label="' + esc(F.testsTotal) + " rows minus " + esc(F.duplicates) + " duplicates equals " + esc(F.testsCounted) + ' counted tests"><span><b>' + n(F.testsTotal) + "</b> rows</span><i>−</i><span><b>" + n(F.duplicates) + "</b> repeats</span><i>=</i><span class=\"eq-final\"><b>" + n(F.testsCounted) + "</b> counted tests</span></div><p class=\"note\">" + T(S.split.equation) + "</p></div>" +

  function initJourney() {
    var active = 0, auto = !reduced, box = $("#steps");
    function show(i) {
      active = i;
      $$(".step", box).forEach(function (b, k) { b.classList.toggle("on", k === i); b.classList.toggle("past", k < i); b.setAttribute("aria-pressed", k === i); });

    show(0);
    if (auto) onView(box, function () { var t = setInterval(function () { if (!auto) return clearInterval(t); show((active + 1) % S.ingestSteps.length); }, 3400); });

    if (!M.samples.length) return;

      var rows = x.mapping.map(function (m) {

        var v = x.clean[m.clean];
        return '<tr class="' + (animate ? "pending" : "") + '"><td data-l="NASA column"><span class="col">' + esc(m.raw) + "</span><code>" + esc(rawV === "" ? "empty" : rawV) + '</code></td><td class="how" data-l="What happens">→ ' + esc(m.how) + ' →</td><td data-l="Clean field"><span class="col">' + esc(m.clean) + "</span><code>" + esc(v == null ? "null" : v) + "</code></td></tr>";

  function initStorage() {

    var c = CHART, W = c.w - c.l - c.r, H = c.h - c.t - c.b;
    function X(v) { return c.l + (v / xMax) * W; }
    function Y(v) { return c.t + H - (v / 100) * H; }

    p.max = xMax;
    var g = "";
    for (var y = 0; y <= 100; y += 20) g += '<line x1="' + c.l + '" x2="' + (c.w - c.r) + '" y1="' + Y(y) + '" y2="' + Y(y) + '" class="grid"/><text x="' + (c.l - 8) + '" y="' + (Y(y) + 4) + '" class="axis" text-anchor="end">' + y + "</text>";
    for (var x = 0; x <= xMax; x += 10) g += '<text x="' + X(x) + '" y="' + (c.h - c.b + 18) + '" class="axis" text-anchor="middle">' + x + "</text>";

    var dots = pts.map(function (q) {
      var id = INV_IDS[q[0]], cx = X(q[2]), cy = Y(q[1]), col = INV[id].c;
      if (q[0] === 1) return '<rect x="' + (cx - 3) + '" y="' + (cy - 3) + '" width="6" height="6" fill="' + col + '" class="pt"/>';
      if (q[0] === 2) return '<path d="M' + cx + " " + (cy - 4) + "l4 4l-4 4l-4-4z" + '" fill="' + col + '" class="pt"/>';
      return '<circle cx="' + cx + '" cy="' + cy + '" r="3.2" fill="' + col + '" class="pt"/>';
    }).join("");
    $("#env-svg").innerHTML = g + "<g>" + dots + '</g><rect id="env-win" class="win" rx="4"/><circle id="env-pin" class="pin" r="6"/>';

    function update() {
      var a = Number(o2.value), b = Number(p.value), res = BPLogic.envelope(pts, a, b, rule);
      $("#o2-out").textContent = a + "%";
      $("#p-out").textContent = b + " psi";
      var win = $("#env-win");
      var x1 = X(Math.max(0, b - rule.p)), x2 = X(Math.min(xMax, b + rule.p)), y1 = Y(Math.min(100, a + rule.o2)), y2 = Y(Math.max(0, a - rule.o2));
      win.setAttribute("x", x1); win.setAttribute("y", y1); win.setAttribute("width", Math.max(2, x2 - x1)); win.setAttribute("height", Math.max(2, y2 - y1));
      var pin = $("#env-pin"); pin.setAttribute("cx", X(b)); pin.setAttribute("cy", Y(a));
      var by = INV_IDS.map(function (id, i) { var k = res.inside.filter(function (q) { return q[0] === i; }).length; return k ? "<span>" + invDot(id) + " " + id + " <b>" + k + "</b></span>" : ""; }).join("");

  // ---------------------------------------------------------------- VESTA
  function vesta() {

      : '<p class="note">The recording did not catch the number, so this demo is switched off until the scan is fixed.</p>';
    // one state per AI engine, so the presets fit however many engines the chain has

    var engines = M.engines.map(function (e, i) {

    }).join("");
    var C = S.chain;
    return section("vesta",
      '<div class="panel replay">' + panelHead(S.replay.title) +
      '<p class="chips" role="group" aria-label="Choose a question">' + qs + "</p>" +
      '<ol class="rail" id="rail">' + rail + '</ol><div id="caption" class="detail tight" aria-live="polite"></div>' +
      '<div class="chat-wrap"><div class="chat" id="chat" tabindex="0" aria-label="Replay of a VESTA answer"></div><div class="log t-e" id="log" tabindex="0" aria-label="Raw event stream"></div></div>' +
      '<p class="actions"><button type="button" class="btn" id="replay-go">↻ Play again</button></p><p class="note">' + esc(S.replay.note) + "</p></div>" +
      '<div class="panel">' + panelHead(S.brains.title) + '<div class="brains"><article><h4>' + esc(S.brains.ai.title) + '</h4><div class="loop" aria-hidden="true"><span>Model</span><i>⇄</i><span>Tools</span><i>→</i><span>Checker</span></div>' + list(S.brains.ai.points) + "</article><article><h4>" + esc(S.brains.offline.title) + '</h4><div class="loop" aria-hidden="true"><span>Rules</span><i>→</i><span>Tools</span><i>→</i><span>Template</span></div>' + list(S.brains.offline.points) + "</article><article><h4>" + esc(S.brains.alert.title) + '</h4><div class="loop" aria-hidden="true"><span>Mission</span><i>→</i><span>Formulas</span><i>→</i><span>Alert</span></div><p>' + T(S.brains.alert.story) + "</p></article></div></div>" +
      '<div class="panel">' + panelHead(S.toolsBoard.title, S.toolsBoard.story) + '<div class="toolgrid">' + tools + "</div></div>" +

      '<div class="panel" id="chain">' + panelHead(C.title, C.story) + '<p class="chips" role="group" aria-label="Scenarios"><button type="button" class="chip" data-preset="' + preset(function () { return "ok"; }) + '">All working</button><button type="button" class="chip" data-preset="' + preset(function (i) { return i < 2 ? "nokey" : i === 2 ? "limit" : "ok"; }) + '">A normal bad day</button><button type="button" class="chip" data-preset="' + preset(function () { return "limit"; }) + '">Everything at its limit</button><button type="button" class="chip" data-preset="' + preset(function () { return "nokey"; }) + '">No keys at all</button></p><div class="engines" id="engines">' + engines + '</div><div class="result" id="chain-result" aria-live="polite"></div><p class="note">' + T(C.detail) + '</p><p class="demo"><b>DEMO</b> ' + esc(C.note.replace(/^DEMO: /, "")) + "</p></div>");
  }
  function initVesta() {
    var run = 0, chat = $("#chat"), log = $("#log"), rail = $("#rail"), current = 0, stages = {};
    S.stages.forEach(function (s) { stages[s.id] = s; });
    function stage(id) {
      var seen = true;
      $$("li", rail).forEach(function (li) {
        if (li.dataset.stage === id) { li.className = "on"; seen = false; rail.scrollLeft = li.offsetLeft - rail.offsetLeft - rail.clientWidth / 2 + li.clientWidth / 2; }
        else if (seen && li.className !== "skip") li.className = "done";
      });
      var st = stages[id];
      $("#caption").innerHTML = "<b>" + esc(st.label) + "</b> " + T(st.story);
    }
    function addLog(type, data) {
      var d = data ? JSON.stringify(data) : "";
      log.insertAdjacentHTML("beforeend", '<div><b>event: ' + esc(type) + "</b>" + (d && d !== "{}" ? "<br>data: " + esc(d.length > 150 ? d.slice(0, 150) + "…" : d) : "") + "</div>");
      log.scrollTop = log.scrollHeight;
    }
    function fmtAnswer(t) { return md(t).replace(/\n/g, "<br>"); }
    function play(i) {
      var my = ++run, r = M.replays[i], alive = function () { return my === run; };
      current = i;
      $$("[data-q]").forEach(function (b, k) { b.classList.toggle("on", k === i); b.setAttribute("aria-pressed", k === i); });
      $$(".tool").forEach(function (t) { t.classList.remove("used"); });
      $$("li", rail).forEach(function (li) { li.className = ""; });
      log.innerHTML = "";
      chat.innerHTML = '<div class="bubble you">' + esc(r.question) + '</div><div class="bubble her"><div class="orb" aria-hidden="true"></div><div class="body"><p class="badge-line" id="r-badge"></p><ul class="tool-steps" id="r-steps"></ul><div class="answer" id="r-text"></div><div id="r-extra"></div></div></div>';
      var seq = sleep(0), textShown = false, uiEvents = [];
      function then(fn, wait) { seq = seq.then(function () { if (!alive()) return; fn(); return sleep(wait); }); }
      then(function () { stage("send"); }, 1100);
      then(function () { stage("gate"); }, 1100);
      then(function () { stage("cache"); }, 1000);
      then(function () { stage("router"); }, 1100);
      r.events.forEach(function (e) {
        if (e.type === "engine") {
          then(function () { $("#r-badge").textContent = e.badge; addLog("engine", { id: e.id, label: e.label, model: e.model, badge: e.badge }); stage("think"); }, 1500);
        } else if (e.type === "step") {
          then(function () {
            stage("tools");
            addLog("step", { tool: e.tool, status: e.status, summary: e.summary });
            var list = $("#r-steps"), found = $$('[data-run="' + e.tool + '"]', list).pop();
            var icon = e.status === "running" ? '<i class="spin"></i>' : e.status === "done" ? '<i class="ok">✓</i>' : '<i class="err">!</i>';
            var row = icon + "<code>" + esc(e.tool) + "</code> <span>" + esc(e.summary) + "</span>";
            if (found && e.status !== "running") { found.innerHTML = row; found.removeAttribute("data-run"); }
            else list.insertAdjacentHTML("beforeend", '<li data-run="' + esc(e.tool) + '">' + row + "</li>");
            var card = $('[data-tool="' + e.tool + '"]');
            if (card) card.classList.add("used");
          }, e.status === "running" ? 500 : 650);
        } else if (e.type === "chart") {
          then(function () { addLog("chart", { title: e.title }); $("#r-extra").insertAdjacentHTML("beforeend", '<p class="chiplet">Chart drawn: ' + esc(e.title) + "</p>"); }, 350);
        } else if (e.type === "ui") {
          uiEvents.push(e.ui);
          then(function () { addLog("ui", e.ui); }, 250);
        } else if (e.type === "text") {
          then(function () { stage("check"); textShown = true; }, 1300);
          then(function () { stage("stream"); addLog("text", { pieces: e.pieces, characters: e.text.length }); }, 0);
          seq = seq.then(function () {
            if (!alive()) return;
            var el = $("#r-text");
            if (reduced) { el.innerHTML = fmtAnswer(e.text); return; }
            return new Promise(function (res) {
              var pos = 0, stepBy = Math.max(2, Math.ceil(e.text.length / 150));
              var t = setInterval(function () {
                if (!alive()) { clearInterval(t); return res(); }
                pos = Math.min(e.text.length, pos + stepBy);
                el.innerHTML = fmtAnswer(e.text.slice(0, pos));
                chat.scrollTop = chat.scrollHeight;
                if (pos >= e.text.length) { clearInterval(t); res(); }
              }, 22);
            });
          });
        } else if (e.type === "sources") {
          then(function () {
            addLog("sources", { count: e.sources.length });
            $("#r-extra").insertAdjacentHTML("beforeend", e.sources.length ? '<p class="srcs"><b>Sources</b> ' + e.sources.slice(0, 5).map(function (s) { var name = String(s.file).split("/").pop(); return "<span>" + esc(name) + (s.row ? " row " + s.row : s.rows ? " rows " + s.rows : s.page ? " p" + s.page : "") + "</span>"; }).join("") + (e.sources.length > 5 ? "<span>+" + (e.sources.length - 5) + " more</span>" : "") + "</p>" : "");
            chat.scrollTop = chat.scrollHeight;
          }, 500);
        } else if (e.type === "confidence") {
          then(function () { addLog("confidence", { confidence: e.confidence }); $("#r-extra").insertAdjacentHTML("beforeend", '<p class="conf-line">Confidence ' + confPill(e.confidence) + "</p>"); chat.scrollTop = chat.scrollHeight; }, 700);
        } else if (e.type === "done") {
          then(function () {
            addLog("done");
            if (uiEvents.length) {
              stage("move");
              $("#r-extra").insertAdjacentHTML("beforeend", uiEvents.map(function (u) { return '<p class="chiplet">Dashboard moves: ' + esc(u.path || u.mission || u.test_id || (u.test_ids ? u.test_ids.length + " tests highlighted" : u.action)) + "</p>"; }).join(""));
              chat.scrollTop = chat.scrollHeight;
            } else {
              $('[data-stage="move"]', rail).className = "skip";
            }
            $$("li", rail).forEach(function (li) { if (li.className === "on") li.className = "done"; });
          }, 0);
        }
      });
      return seq;
    }
    $$("[data-q]").forEach(function (b) { b.addEventListener("click", function () { play(Number(b.dataset.q)); }); });
    $("#replay-go").addEventListener("click", function () { play(current); });
    if (reduced) play(0); else onView($(".replay"), function () { play(0); });
    if (!reduced) { $("#caption").innerHTML = "<b>" + esc(S.stages[0].label) + "</b> " + T(S.stages[0].story); }

    // grounding demo reveals step by step
    var ground = $("#ground");
    if (ground) {
      if (!reduced) {
        $$("li", ground).forEach(function (li) { li.classList.add("wait"); });
        onView(ground, function () { $$("li", ground).reduce(function (p, li) { return p.then(function () { li.classList.remove("wait"); return sleep(1100); }); }, sleep(100)); });
      }
    }

    // backup chain
    var ids = M.engines.filter(function (e) { return e.id !== "offline"; }).map(function (e) { return e.id; });
    var states = {}, chainRun = 0, labels = S.chain.stateLabels, order = M.fallback.states;
    ids.forEach(function (id) { states[id] = "ok"; });
    function renderChain() {
      var my = ++chainRun, key = ids.map(function (id) { return states[id]; }).join("|"), res = M.fallback.results[key];
      $$(".eng").forEach(function (el) {
        var id = el.dataset.eng;
        el.className = "eng";
        if (id !== "offline") { el.classList.add("s-" + states[id]); $("[data-state]", el).textContent = labels[states[id]]; }
      });
      $$("[data-preset]").forEach(function (b) { var on = b.dataset.preset.split(",").join("|") === key; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
      var out = $("#chain-result");
      out.innerHTML = '<p class="muted">Finding an engine…</p>';
      res.path.reduce(function (p, id) {
        return p.then(function () {
          if (my !== chainRun) return;
          var el = $('[data-eng="' + id + '"]');
          if (el) { el.classList.add(id === res.winner ? "hit" : "miss"); }
          return sleep(id === res.winner ? 0 : 480);
        });
      }, sleep(120)).then(function () {
        if (my !== chainRun) return;
        out.innerHTML = '<p class="r-title">What you would see</p><p class="badge-line">' + esc(res.badge) + "</p>" + (res.note ? '<p class="fall-note">' + esc(res.note) + "</p>" : '<p class="muted">No fallback note needed.</p>');
      });
    }
    $$("button.eng").forEach(function (b) { b.addEventListener("click", function () { var id = b.dataset.eng; states[id] = order[(order.indexOf(states[id]) + 1) % order.length]; renderChain(); }); });
    $$("[data-preset]").forEach(function (b) { b.addEventListener("click", function () { var v = b.dataset.preset.split(","); ids.forEach(function (id, i) { states[id] = v[i] || "ok"; }); renderChain(); }); });
    renderChain();
  }

  // ---------------------------------------------------------------- honesty
  function honesty() {
